<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Template Editor — GrapesJS prototype</title>

<!-- GrapesJS from CDN (MIT), pinned + Subresource Integrity. No build step. -->
<link rel="stylesheet"
      href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css"
      integrity="sha384-VQpDDpq9/dYXpQKHbAaIJfpzr+OYMehLqaUQ46czyQuvz/fAH0YH9MD0XobM7qGC"
      crossorigin="anonymous">
<script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"
        integrity="sha384-GtO66iNEzOxoG979zusrThmhRJWmI0r7zJRKFNZWThFrMwLu6zCfvLzrxx99KTgq"
        crossorigin="anonymous"></script>

<style>
  :root { --bar: #1f2430; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #e8eaed; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bar); padding: 8px 14px; border-bottom: 1px solid #000;
  }
  .topbar h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
  .topbar button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  .topbar button.secondary { background: #3a4150; }
  .topbar .spacer { flex: 1; }
  .topbar .hint { font-size: 12px; color: #9aa0aa; }

  .layout { display: flex; height: calc(100vh - 47px); }
  #blocks { width: 230px; background: #20242e; overflow-y: auto; padding: 6px; }
  #blocks .gjs-block {
    width: auto; min-height: auto; margin: 4px 0; padding: 9px 10px;
    font-size: 12.5px; border: 1px solid #333a47; border-radius: 6px;
    background: #2a3140; color: #e8eaed; display: flex; align-items: center; gap: 8px;
  }
  #blocks .gjs-block-category .gjs-title { color: #aab; }
  .editor-wrap { flex: 1; }

  /* Modal for export / preview output */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff; color: #111; width: min(900px, 92vw); height: min(80vh, 760px);
    border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal header { padding: 10px 14px; background: #f1f3f5; display: flex; align-items: center; }
  .modal header strong { font-size: 14px; }
  .modal header button { margin-left: auto; border: 0; background: #e03131; color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .modal .body { flex: 1; overflow: auto; }
  .modal textarea { width: 100%; height: 100%; border: 0; padding: 14px; font: 12px/1.5 ui-monospace, monospace; resize: none; }
  .modal iframe { width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<div class="topbar">
  <h1>📄 Invoice Template Editor <span class="hint">— GrapesJS prototype</span></h1>
  <button id="btn-preview">Preview with sample data</button>
  <button id="btn-export" class="secondary">Export template (HTML)</button>
  <div class="spacer"></div>
  <span class="hint">Drag tokens from the left → design → export → render through Dompdf</span>
</div>

<div class="layout">
  <div id="blocks"></div>
  <div class="editor-wrap"><div id="gjs"></div></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <header><strong id="modal-title">Output</strong><button onclick="document.getElementById('modal').classList.remove('open')">Close</button></header>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
/*
 * Invoice tokens. Each block drops a snippet containing {{token}} placeholders.
 * In production these are replaced server-side with WooCommerce order data, and
 * any Arabic is run through ArabicShaper before Dompdf (the browser shapes the
 * Arabic in this preview itself, so it already reads correctly here).
 */
const BLOCKS = [
  { id: 'doc-title', label: '🏷️ Document title', category: 'Header',
    content: '<h1 style="text-align:center;text-transform:uppercase;margin:2mm 0;">{{document_title}} <span dir="rtl" style="font-family:\'Noto Naskh Arabic\',serif;">{{document_title_ar}}</span></h1>' },

  { id: 'logo', label: '🖼️ Logo', category: 'Header',
    content: '<div style="text-align:center;"><img src="{{logo}}" alt="logo" style="max-height:2.6cm;"/></div>' },

  { id: 'shop-en', label: '🏢 Shop block (EN)', category: 'Header',
    content: '<div class="shop-en"><strong>{{shop_name}}</strong><br>{{shop_address}}</div>' },

  { id: 'shop-ar', label: '🏢 Shop block (AR)', category: 'Header',
    content: '<div class="shop-ar" dir="rtl" style="font-family:\'Noto Naskh Arabic\',serif;text-align:right;"><strong>{{shop_name_ar}}</strong><br>{{shop_address_ar}}</div>' },

  { id: 'contact-line', label: '☎️ TRN · phone · email', category: 'Header',
    content: '<div style="font-size:8pt;"><span>TRN: {{trn}}</span> &nbsp;|&nbsp; <span>{{shop_phone}}</span> &nbsp;|&nbsp; <span>{{shop_email}}</span></div>' },

  { id: 'header-row', label: '⬚ Header row (EN | logo | AR)', category: 'Header',
    content: `<table style="width:100%;border-bottom:1px solid #000;"><tr style="vertical-align:top;">
      <td style="width:38%;"><strong>{{shop_name}}</strong><br>{{shop_address}}<div style="font-size:8pt;margin-top:1.5mm;">TRN: {{trn}} &nbsp;|&nbsp; {{shop_phone}} &nbsp;|&nbsp; {{shop_email}}</div></td>
      <td style="width:24%;text-align:center;vertical-align:middle;"><img src="{{logo}}" style="max-height:2.6cm;"/></td>
      <td style="width:38%;text-align:right;" dir="rtl"><span style="font-family:'Noto Naskh Arabic',serif;"><strong>{{shop_name_ar}}</strong><br>{{shop_address_ar}}</span></td>
    </tr></table>` },

  { id: 'bill-to', label: '👤 Customer address', category: 'Parties',
    content: '<div class="bill-to">{{billing_address}}</div>' },

  { id: 'meta', label: '🔢 Invoice meta', category: 'Parties',
    content: `<table style="font-size:9pt;"><tr><th style="text-align:left;">Invoice Number:</th><td>{{invoice_number}}</td></tr>
      <tr><th style="text-align:left;">Invoice Date:</th><td>{{invoice_date}}</td></tr>
      <tr><th style="text-align:left;">Order Number:</th><td>{{order_number}}</td></tr>
      <tr><th style="text-align:left;">Payment Method:</th><td>{{payment_method}}</td></tr></table>` },

  { id: 'items', label: '📦 Line items', category: 'Body',
    content: '<div data-token="line_items">{{line_items}}</div>' },

  { id: 'totals', label: '∑ Totals', category: 'Body',
    content: '<div data-token="totals" style="width:40%;margin-left:auto;">{{totals}}</div>' },

  { id: 'spacer', label: '␣ Spacer', category: 'Body',
    content: '<div style="height:6mm;"></div>' },
];

/* Sample values used by "Preview with sample data". */
const SAMPLE = {
  document_title: 'Tax Invoice',
  document_title_ar: 'فاتورة ضريبية',
  logo: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80"><rect width="120" height="80" fill="none" stroke="%23c00"/><text x="60" y="48" font-size="34" text-anchor="middle" fill="%23036">m</text></svg>'),
  shop_name: 'Milano Leather Trading LLC',
  shop_address: 'Al Buteen<br>Dubai<br>112247<br>United Arab Emirates',
  shop_name_ar: 'ميلانو ليذر تريدينج ش.ذ.م.م',
  shop_address_ar: 'البطين<br>دبي<br>الإمارات العربية المتحدة',
  trn: '100579920800003',
  shop_phone: '+97142526744',
  shop_email: 'info@milanoleather.ae',
  billing_address: 'NESTO HYPERMARKET LLC BRANCH<br>Burj Nahar Mall<br>Dubai<br>TRN: 100247587700003',
  invoice_number: '2026-04-000004',
  invoice_date: '2026-04-22',
  order_number: '237',
  order_date: '2026-04-22',
  payment_method: 'Cheque',
  line_items: '<table style="width:100%;border-collapse:collapse;font-size:9pt;" border="1" cellpadding="4"><tr><th>Sr</th><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr><tr><td>1</td><td>Classic Milano Cotton Belt</td><td>24</td><td>AED 40.00</td><td>AED 960.00</td></tr><tr><td>2</td><td>Force Automatic Wallet</td><td>12</td><td>AED 25.00</td><td>AED 300.00</td></tr></table>',
  totals: '<table style="width:100%;font-size:9pt;"><tr><th style="text-align:left;">Subtotal</th><td style="text-align:right;">AED 1,260.00</td></tr><tr><th style="text-align:left;">VAT 5%</th><td style="text-align:right;">AED 63.00</td></tr><tr><th style="text-align:left;"><strong>Total</strong></th><td style="text-align:right;"><strong>AED 1,323.00</strong></td></tr></table>',
};

/* Starter layout shown on the canvas — mirrors the current UAE invoice so the
   editor opens on something familiar and editable, not a blank page. */
const STARTER = `
  ${BLOCKS.find(b => b.id === 'header-row').content}
  ${BLOCKS.find(b => b.id === 'doc-title').content}
  <table style="width:100%;"><tr style="vertical-align:top;">
    <td style="width:55%;">${BLOCKS.find(b => b.id === 'bill-to').content}</td>
    <td style="width:45%;">${BLOCKS.find(b => b.id === 'meta').content}</td>
  </tr></table>
  <div style="height:6mm;"></div>
  ${BLOCKS.find(b => b.id === 'items').content}
  <div style="height:6mm;"></div>
  ${BLOCKS.find(b => b.id === 'totals').content}
`;

const editor = grapesjs.init({
  container: '#gjs',
  height: '100%',
  fromElement: false,
  storageManager: false,
  blockManager: { appendTo: '#blocks' },
  components: STARTER,
  canvas: {
    styles: ['https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap'],
  },
});

BLOCKS.forEach(b => editor.BlockManager.add(b.id, {
  label: b.label, category: b.category, content: b.content,
}));

/* Replace {{tokens}} with sample values. Unknown tokens are left visible so a
   designer can see which placeholders still need data. */
function merge(html) {
  return html.replace(/{{\s*([\w]+)\s*}}/g, (m, key) =>
    Object.prototype.hasOwnProperty.call(SAMPLE, key) ? SAMPLE[key] : m);
}

function openModal(title, node) {
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  body.appendChild(node);
  document.getElementById('modal').classList.add('open');
}

document.getElementById('btn-export').onclick = () => {
  const tpl = `<style>\n${editor.getCss()}\n</style>\n${editor.getHtml()}`;
  const ta = document.createElement('textarea');
  ta.value = tpl;
  openModal('Exported template (save this; render through Dompdf)', ta);
};

document.getElementById('btn-preview').onclick = () => {
  const merged = `<!doctype html><html><head><meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap">
    <style>body{font-family:'Roboto',sans-serif;padding:18px;color:#111}${editor.getCss()}</style>
    </head><body>${merge(editor.getHtml())}</body></html>`;
  const iframe = document.createElement('iframe');
  iframe.srcdoc = merged;
  openModal('Preview with sample data (tokens merged)', iframe);
};
</script>
</body>
</html>
